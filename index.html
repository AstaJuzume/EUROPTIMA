(function(){
'use strict';
var KEY='europtima-portfolio-demo-v2';
var months=[];for(var yr=2026;yr<=2027;yr++)for(var mo=1;mo<=12;mo++)if(yr===2027||mo>=7)months.push(yr+'-'+String(mo).padStart(2,'0'));
var seed={rate:4.3,projects:[
{id:'p1',name:'Portico Marina',company:'Portico',region:'Warsaw',manager:'Mirek Gołębski',currency:'PLN',contract:780000,status:'Active'},
{id:'p2',name:'TR Main Contract',company:'Europtima',region:'Warsaw',manager:'Paweł Nowotniak',currency:'PLN',contract:1240000,status:'Active'},
{id:'p3',name:'Ochnik Garwolin',company:'Portico',region:'Gdańsk',manager:'Magda Płiszczyńska',currency:'PLN',contract:490000,status:'Active'},
{id:'p4',name:'CBRE WDC',company:'Europtima',region:'Kraków',manager:'Michał Miedziejewski',currency:'EUR',contract:280000,status:'Active'},
{id:'p5',name:'Międzylesie Hospital',company:'Portico',region:'Warsaw',manager:'Bartek Stanisławski',currency:'PLN',contract:635000,status:'Active'},
{id:'p6',name:'Bródno Hospital',company:'Europtima',region:'Warsaw',manager:'Karol Kalinowski',currency:'PLN',contract:720000,status:'Pipeline'}],
people:[{id:'e1',name:'Mirek Gołębski',type:'Employment',company:'Portico',cost:4800},{id:'e2',name:'Paweł Nowotniak',type:'B2B',company:'Europtima',cost:5750},{id:'e3',name:'Magda Płiszczyńska',type:'Employment',company:'Portico',cost:3900},{id:'e4',name:'Michał Miedziejewski',type:'B2B',company:'Europtima',cost:4300},{id:'e5',name:'Bartek Stanisławski',type:'Employment',company:'Portico',cost:3700},{id:'e6',name:'Karol Kalinowski',type:'B2B',company:'Europtima',cost:4100}],
alloc:[],revenues:[],costs:[]};
var pairs=[['e1','p1',60],['e1','p2',40],['e2','p2',75],['e2','p4',25],['e3','p3',75],['e3','p1',25],['e4','p4',70],['e4','p2',30],['e5','p5',80],['e5','p1',20],['e6','p2',70],['e6','p6',30]];
months.forEach(function(m,i){pairs.forEach(function(x){seed.alloc.push({person:x[0],project:x[1],month:m,pct:x[2]})});seed.projects.forEach(function(p,j){seed.revenues.push({project:p.id,month:m,kind:i<=3?'Actual':'Forecast',amount:Math.round([65000,103000,45000,23500,56000,60000][j]*(.8+((i*3+j*2)%7)/13))})})});
[['p1','Subcontractor',18000,'2026-09','Architectural partner'],['p2','Subcontractor',25000,'2026-10','Design services'],['p4','Subcontractor',4400,'2026-11','Engineering support'],['p3','Subcontractor',11000,'2027-01','Technical advisor'],['p1','Expense',1300,'2026-09','Travel'],['p2','Expense',2300,'2026-10','Travel']].forEach(function(x,i){seed.costs.push({id:'c'+i,project:x[0],type:x[1],amount:x[2],month:x[3],label:x[4]})});
var db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(seed))}catch(e){db=JSON.parse(JSON.stringify(seed))}
if(!Array.isArray(db.actuals))db.actuals=[];
if(!db.actuals.length){db.revenues.filter(function(r){return r.kind==='Actual'}).forEach(function(r){db.actuals.push({project:r.project,month:r.month,revenue:r.amount,staff:0,sub:0,expense:0})})}
db.projects.forEach(function(p){if(!p.portfolio)p.portfolio=p.region||'Warsaw'});
var state={tab:'overview',month:'2026-11',company:'All',portfolio:'All',role:'Admin',modal:null,edit:null};
var tabs=[['overview','Overview'],['projects','Projects'],['allocation','Staff allocation'],['revenue','Revenue plan'],['actuals','Plan vs actual'],['subcontractors','Subcontractors'],['expenses','Expenses'],['employees','Employees'],['reports','Financial reports'],['settings','Settings']];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(n){return Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:0})}
function eur(n,c){return Number(n||0)/(c==='PLN'?Number(db.rate)||4.3:1)}
function cash(n){return '€ '+num(n)}
function label(m){return new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}
function proj(id){return db.projects.find(function(p){return p.id===id})}
function employee(id){return db.people.find(function(p){return p.id===id})}
function admin(){return state.role==='Admin'}
function editable(){return state.role!=='Executive'}
function visible(){return db.projects.filter(function(p){return(state.company==='All'||p.company===state.company)&&(state.portfolio==='All'||p.portfolio===state.portfolio)&&(state.role!=='Project director'||p.manager==='Mirek Gołębski')})}
function portfolioList(){return ['All'].concat([...new Set(db.projects.map(function(p){return p.portfolio||'Warsaw'}))].sort())}
function actualEntry(p,m){return db.actuals.find(function(a){return a.project===p&&a.month===m})||{revenue:0,staff:0,sub:0,expense:0}}
function actualCalc(p,m){var a=actualEntry(p.id,m);var z={revenue:eur(a.revenue,p.currency),staff:eur(a.staff,p.currency),sub:eur(a.sub,p.currency),expense:eur(a.expense,p.currency)};z.cost=z.staff+z.sub+z.expense;z.profit=z.revenue-z.cost;return z}
function actualTotals(ps,m){var z={revenue:0,staff:0,sub:0,expense:0,cost:0,profit:0};ps.forEach(function(p){var a=actualCalc(p,m);Object.keys(z).forEach(function(k){z[k]+=a[k]})});return z}
function allocation(e,p,m){var a=db.alloc.find(function(x){return x.person===e&&x.project===p&&x.month===m});return a?Number(a.pct):0}
function calc(p,m){var revenue=db.revenues.filter(function(x){return x.project===p.id&&x.month===m}).reduce(function(s,x){return s+eur(x.amount,p.currency)},0);
var staff=db.people.reduce(function(s,e){return s+Number(e.cost)*allocation(e.id,p.id,m)/100},0);
var sub=0,expense=0;db.costs.forEach(function(x){if(x.project===p.id&&x.month===m){if(x.type==='Subcontractor')sub+=eur(x.amount,p.currency);else expense+=eur(x.amount,p.currency)}});
return{revenue:revenue,staff:staff,sub:sub,expense:expense,cost:staff+sub+expense,profit:revenue-staff-sub-expense}};
function totals(list,m){var z={revenue:0,staff:0,sub:0,expense:0,cost:0,profit:0};list.forEach(function(p){var f=calc(p,m);Object.keys(z).forEach(function(k){z[k]+=f[k]})});return z}
function select(id,values,current){return '<select id="'+id+'">'+values.map(function(v){return '<option value="'+esc(v)+'" '+(v===current?'selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>'}
function projectOptions(){return db.projects.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join('')}
function top(title,desc,action){return '<div class="row-head"><div><h1>'+title+'</h1><p style="margin:0">'+desc+'</p></div>'+(action||'')+'</div>'}
function btn(name,action){return '<button class="btn primary" data-action="'+action+'">'+name+'</button>'}
function table(head,rows){return '<div class="table-wrap"><table><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function reportRow(p,m){var f=calc(p,m),margin=f.revenue?f.profit/f.revenue*100:0;return '<tr><td>'+esc(p.company)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.portfolio)+'</td><td class="number">'+cash(f.revenue)+'</td><td class="number">'+cash(f.staff)+'</td><td class="number">'+cash(f.sub)+'</td><td class="number">'+cash(f.expense)+'</td><td class="number '+(f.profit>=0?'good':'bad')+'">'+cash(f.profit)+'</td><td class="number">'+margin.toFixed(1)+'%</td></tr>'}
function overview(){var ps=visible(),f=totals(ps,state.month),af=actualTotals(ps,state.month),margin=f.revenue?f.profit/f.revenue*100:0;
var values=[['Planned revenue',cash(f.revenue),'Selected month'],['Actual revenue',cash(af.revenue),'Entered actuals'],['Planned gross profit',cash(f.profit),'Revenue less total costs'],['Actual gross profit',cash(af.profit),'Actual revenue less costs']];
var cards='<div class="metrics">'+values.map(function(x){return '<div class="card"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+x[1]+'</div><div class="meta">'+x[2]+'</div></div>'}).join('')+'</div>';
var byCo=['Europtima','Portico'].map(function(c){var t=totals(ps.filter(function(p){return p.company===c}),state.month);return '<tr><td>'+c+'</td><td class="number">'+cash(t.revenue)+'</td><td class="number">'+cash(t.cost)+'</td><td class="number">'+cash(t.profit)+'</td></tr>'});
return top('Executive overview','Project profitability and resource commitments at a glance')+cards+'<div class="grid"><div class="card"><h2>Financial overview by company</h2>'+table(['Company','Revenue','Cost','Profit'],byCo)+'</div><div class="card"><h2>Project profit forecast</h2>'+ps.map(function(p){var v=calc(p,state.month);var margin=v.revenue?v.profit/v.revenue*100:0;return '<div class="stat-line"><span>'+esc(p.name)+'</span><strong>'+margin.toFixed(1)+'%</strong></div><div class="bar"><div style="width:'+Math.max(0,Math.min(100,margin))+'%"></div></div>'}).join('')+'</div></div>'}
function projects(){var list=visible(),portfolios=[...new Set(list.map(function(p){return p.portfolio}))].sort();return top('Projects','Projects grouped by portfolio',editable()?btn('+ Add project','project'):'')+portfolios.map(function(portfolio){return '<div class="card" style="margin-bottom:18px"><h2>'+esc(portfolio)+'</h2>'+table(['Project','Company','Project director','Contract','Currency','Status',''],list.filter(function(p){return p.portfolio===portfolio}).map(function(p){return '<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+esc(p.company)+'</td><td>'+esc(p.manager)+'</td><td class="number">'+num(p.contract)+'</td><td>'+esc(p.currency)+'</td><td><span class="pill">'+esc(p.status)+'</span></td><td>'+(editable()?'<button class="btn small" data-edit="project:'+p.id+'">Edit</button>':'')+'</td></tr>'}))+'</div>'}).join('')}
function employees(){return top('Employee register','Confidential monthly employment and B2B cost rates',admin()?btn('+ Add employee','employee'):'')+'<div class="notice">Employee-specific cost rates are visible only in the Admin demo role. Production access control must be enforced on the server.</div><div class="card">'+table(['Employee','Company','Contract type','Monthly cost EUR',''],db.people.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.company+'</td><td>'+p.type+'</td><td class="number">'+(admin()?cash(p.cost):'Restricted')+'</td><td>'+(admin()?'<button class="btn small" data-edit="employee:'+p.id+'">Edit</button>':'')+'</td></tr>'}))+'</div>'}
function allocationPage(){var mm=months.slice(Math.max(0,months.indexOf(state.month)-1),months.indexOf(state.month)+5);
return top('Staff allocation','Plan staff time across projects; percentage of each month',editable()?btn('+ Add allocation','allocation'):'')+'<div class="notice">Edit the allocation percentages directly. Total assignments above 100% are highlighted. Staff costs recalculate automatically.</div><div class="card"><div class="table-wrap"><table class="wide-table"><thead><tr><th>Employee</th><th>Project</th>'+mm.map(function(m){return '<th class="month-head">'+label(m)+'</th>'}).join('')+'</tr></thead><tbody>'+Object.values(db.alloc.filter(function(a){return mm.indexOf(a.month)>=0&&visible().some(function(p){return p.id===a.project})}).reduce(function(group,a){var k=a.person+'|'+a.project;if(!group[k])group[k]=a;return group},{})).map(function(a){return '<tr><td>'+esc(employee(a.person)?.name||'')+'</td><td>'+esc(proj(a.project)?.name||'')+'</td>'+mm.map(function(m){var pct=allocation(a.person,a.project,m);return '<td class="number"><input class="edit" type="number" min="0" max="100" step="5" data-alloc="'+a.person+'|'+a.project+'|'+m+'" value="'+pct+'" '+(editable()?'':'disabled')+'></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div><div class="card" style="margin-top:16px"><h2>Employee utilization check · '+label(state.month)+'</h2>'+table(['Employee','Allocated','Status'],db.people.map(function(e){var sum=db.alloc.filter(function(a){return a.person===e.id&&a.month===state.month}).reduce(function(s,a){return s+Number(a.pct)},0);return '<tr><td>'+esc(e.name)+'</td><td>'+sum+'%</td><td><span class="pill '+(sum>100?'alloc-warning':'green')+'">'+(sum>100?'Overallocated':'Within capacity')+'</span></td></tr>'}))+'</div><div class="card" style="margin-top:16px"><h2>Employee utilization · Total staff cost by project · '+label(state.month)+'</h2><p class="note">Monthly planned staff cost, aggregated by project. Individual cost rates are restricted to Admin.</p>'+table(['Portfolio','Project','Employees allocated','Total staff cost EUR'],visible().map(function(p){var staff=db.people.reduce(function(sum,e){return sum+(allocation(e.id,p.id,state.month)>0?1:0)},0);return '<tr><td>'+esc(p.portfolio)+'</td><td>'+esc(p.name)+'</td><td class="number">'+staff+'</td><td class="number"><strong>'+cash(calc(p,state.month).staff)+'</strong></td></tr>'}).concat(['<tr><td colspan="3"><strong>Total (visible projects)</strong></td><td class="number"><strong>'+cash(totals(visible(),state.month).staff)+'</strong></td></tr>']))+'</div>'}
function revenue(){var mm=months.slice(Math.max(0,months.indexOf(state.month)-1),months.indexOf(state.month)+5);
return top('Revenue forecast','Manage monthly actuals and forecasts in project currency')+'<div class="card"><div class="table-wrap"><table class="wide-table"><thead><tr><th>Project</th><th>Currency</th>'+mm.map(function(m){return '<th>'+label(m)+'</th>'}).join('')+'</tr></thead><tbody>'+visible().map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.currency+'</td>'+mm.map(function(m){var x=db.revenues.find(function(r){return r.project===p.id&&r.month===m});return '<td><input type="number" min="0" step="100" style="width:112px" data-revenue="'+p.id+'|'+m+'" value="'+(x?x.amount:0)+'" '+(editable()?'':'disabled')+'></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div><p class="note">Figures entered in PLN are converted to EUR for the consolidated report using the admin-managed exchange rate.</p>'}
function costsPage(type){var sub=type==='Subcontractor';return top(sub?'Subcontractors':'Expenses',sub?'Fixed contractor commitments by project and period':'Travel and other operational project expenses',editable()?btn(sub?'+ Add subcontractor':'+ Add expense',sub?'subcontractor':'expense'):'')+'<div class="card">'+table(['Portfolio','Project','Description','Month','Amount','Currency',''],db.costs.filter(function(x){return x.type===type&&visible().some(function(p){return p.id===x.project})}).map(function(c){var p=proj(c.project);return '<tr><td>'+esc(p.portfolio)+'</td><td>'+esc(p.name)+'</td><td>'+esc(c.label)+'</td><td>'+label(c.month)+'</td><td class="number">'+num(c.amount)+'</td><td>'+p.currency+'</td><td>'+(editable()?'<button class="btn small" data-edit="cost:'+c.id+'">Edit</button>':'')+'</td></tr>'}))+'</div>'}
function subcontractors(){return costsPage('Subcontractor')}
function expenses(){return costsPage('Expense')}
function comparisonCharts(){
var ps=visible(),idx=months.indexOf(state.month),range=months.slice(Math.max(0,idx-3),Math.min(months.length,idx+4));
function known(p,m){return db.actuals.some(function(a){return a.project===p.id&&a.month===m})}
function fmt(v){var n=Math.abs(v);return (v<0?'-':'')+'€'+(n>=1000000?(n/1000000).toFixed(2)+'m':n>=1000?(n/1000).toFixed(1)+'k':num(n))}
var series=range.map(function(m){var plan=totals(ps,m),reported=ps.filter(function(p){return known(p,m)}),act=actualTotals(reported,m),pcomp=totals(reported,m);return {m:m,plan:plan,actual:act,reported:reported.length,total:ps.length,comparable:pcomp}});
var max=Math.max(1,...series.map(function(v){return Math.max(v.plan.revenue,v.actual.revenue)})),barH=135;
var monthly='<div class="fin-card"><div class="fin-cardhead"><div><div class="fin-eyebrow">REVENUE PERFORMANCE</div><h2>Plan & actual trends</h2><div class="fin-sub">Monthly revenue across selected projects</div></div><div class="fin-legend"><span><i class="l-plan"></i>Plan</span><span><i class="l-actual"></i>Actual</span></div></div><div class="fin-chart"><div class="fin-gridline" style="top:25%"></div><div class="fin-gridline" style="top:50%"></div><div class="fin-gridline" style="top:75%"></div>'+series.map(function(v){var hp=Math.max(3,Math.round(v.plan.revenue/max*barH)),ha=Math.max(3,Math.round(v.actual.revenue/max*barH)),has=v.reported>0,delta=v.actual.revenue-v.comparable.revenue;return '<div class="fin-period '+(v.m===state.month?'selected':'')+'"><div class="fin-plot"><div class="fin-bar plan" style="height:'+hp+'px" title="Planned '+fmt(v.plan.revenue)+'"></div>'+(has?'<div class="fin-bar actual" style="height:'+ha+'px" title="Reported actual '+fmt(v.actual.revenue)+'"></div>':'<div class="fin-no-data">—</div>')+'</div><div class="fin-periodname">'+label(v.m)+'</div><div class="fin-perioddelta '+(has?(delta>=0?'positive':'negative'):'neutral')+'">'+(has?(delta>=0?'+':'')+fmt(delta):'Pending')+'</div></div>'}).join('')+'</div><div class="fin-footer"><span>Variance compares reported projects only</span><span>'+label(state.month)+' selected</span></div></div>';
var pstats=ps.map(function(p){var plan=calc(p,state.month),act=actualCalc(p,state.month),has=known(p,state.month),delta=act.profit-plan.profit;return {p:p,plan:plan,actual:act,has:has,delta:delta}});
var maxProfit=Math.max(1,...pstats.map(function(v){return Math.max(Math.abs(v.plan.profit),Math.abs(v.actual.profit))}));
var summary='<div class="fin-card"><div class="fin-cardhead"><div><div class="fin-eyebrow">PROJECT PROFITABILITY</div><h2>Gross profit by project</h2><div class="fin-sub">'+label(state.month)+' · planned vs reported</div></div><span class="fin-count">'+pstats.length+' projects</span></div><div class="fin-projects">'+pstats.map(function(v){var planWidth=Math.max(2,Math.round(Math.abs(v.plan.profit)/maxProfit*100)),actWidth=Math.max(2,Math.round(Math.abs(v.actual.profit)/maxProfit*100));return '<div class="fin-project"><div class="fin-projecthead"><span class="fin-projectname">'+esc(v.p.name)+'</span><span class="fin-projectvalue">'+fmt(v.plan.profit)+' <span class="muted">plan</span></span></div><div class="fin-track"><div class="fin-trackplan" style="width:'+planWidth+'%"></div>'+(v.has?'<div class="fin-trackactual '+(v.actual.profit<0?'loss':'')+'" style="width:'+actWidth+'%"></div>':'')+'</div><div class="fin-projectfoot"><span>'+esc(v.p.portfolio)+'</span><span class="'+(v.has?(v.delta>=0?'positive':'negative'):'neutral')+'">'+(v.has?((v.delta>=0?'+':'')+fmt(v.delta)+' vs plan'):'Awaiting actuals')+'</span></div></div>'}).join('')+'</div></div>';
var timeline='<div class="fin-card fin-wide"><div class="fin-cardhead"><div><div class="fin-eyebrow">PORTFOLIO PERFORMANCE</div><h2>Project revenue timeline</h2><div class="fin-sub">Revenue realization across months · actual / plan</div></div><div class="fin-legend"><span><i style="background:#e5efff"></i>Planned</span><span><i style="background:#20a08e"></i>Reported</span><span><i style="background:#e8ebf0"></i>Pending</span></div></div><div class="fin-scroll"><div class="fin-timeline"><div class="fin-tline-header"><div>PROJECT / PORTFOLIO</div>'+range.map(function(m){return '<div>'+label(m)+'</div>'}).join('')+'</div>'+ps.map(function(p){return '<div class="fin-tline-row"><div class="fin-tline-project"><strong>'+esc(p.name)+'</strong><small>'+esc(p.portfolio)+'</small></div>'+range.map(function(m){var v=calc(p,m),a=actualCalc(p,m),has=known(p,m),ratio=v.revenue>0?a.revenue/v.revenue*100:0,progress=Math.min(100,Math.max(0,ratio)),under=has&&ratio<90;return '<div class="fin-tline-cell" title="'+esc(p.name)+' · '+label(m)+' | Planned '+fmt(v.revenue)+' | '+(has?'Actual '+fmt(a.revenue):'Actual pending')+'">'+(has?'<div class="fin-tline-top"><strong class="'+(under?'negative':'')+'">'+Math.round(ratio)+'%</strong><span>'+fmt(a.revenue)+'</span></div><div class="fin-tline-track"><div class="'+(under?'under':'')+'" style="width:'+progress+'%"></div></div>':'<div class="fin-pending">Not reported</div><div class="fin-tline-track pending"></div>')+'</div>'}).join('')+'</div>'}).join('')+'</div></div><div class="fin-footer"><span>Values in EUR · select a different month above to navigate</span><span>100% = actual equals plan</span></div></div>';
return '<div class="fin-dashboard">'+monthly+summary+timeline+'</div>'
}
function actuals(){return top('Plan vs actual','Enter actual revenue and cost values by project; compare against the monthly plan')+'<div class="notice">Actual values are entered manually in project currency. Planned staff costs are calculated from staff allocation. Actual staff costs are independent reported figures, not timesheets.</div>'+comparisonCharts()+visible().map(function(p){var plan=calc(p,state.month),act=actualCalc(p,state.month),a=actualEntry(p.id,state.month);return '<div class="card" style="margin-bottom:15px"><h2>'+esc(p.name)+' · '+esc(p.portfolio)+' · '+esc(p.currency)+'</h2>'+table(['Metric','Plan EUR','Actual EUR','Variance EUR','Enter actual '+p.currency],['revenue','staff','sub','expense'].map(function(k){var names={revenue:'Revenue',staff:'Staff costs',sub:'Subcontractors',expense:'Other expenses'};return '<tr><td>'+names[k]+'</td><td class="number">'+cash(plan[k])+'</td><td class="number">'+cash(act[k])+'</td><td class="number">'+cash(act[k]-plan[k])+'</td><td><input class="edit" style="width:120px" type="number" min="0" step="100" data-actual="'+p.id+'|'+state.month+'|'+k+'" value="'+Number(a[k]||0)+'" '+(editable()?'':'disabled')+'></td></tr>'}).concat(['<tr><td><strong>Gross profit</strong></td><td class="number">'+cash(plan.profit)+'</td><td class="number">'+cash(act.profit)+'</td><td class="number">'+cash(act.profit-plan.profit)+'</td><td>Calculated</td></tr>']))+'</div>'}).join('')}
function reports(){var ps=visible(),f=totals(ps,state.month),af=actualTotals(ps,state.month);return top('Financial reports','Monthly planned and actual P&L by project and portfolio in EUR',btn('Export CSV','export'))+'<div class="metrics">'+[['Planned revenue',f.revenue],['Actual revenue',af.revenue],['Planned profit',f.profit],['Actual profit',af.profit]].map(function(x){return '<div class="card"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+cash(x[1])+'</div></div>'}).join('')+'</div><div class="card"><h2>Plan vs actual – project P&L</h2>'+table(['Portfolio','Project','Plan revenue','Actual revenue','Plan cost','Actual cost','Plan profit','Actual profit','Profit variance'],ps.map(function(p){var v=calc(p,state.month),a=actualCalc(p,state.month);return '<tr><td>'+esc(p.portfolio)+'</td><td>'+esc(p.name)+'</td><td class="number">'+cash(v.revenue)+'</td><td class="number">'+cash(a.revenue)+'</td><td class="number">'+cash(v.cost)+'</td><td class="number">'+cash(a.cost)+'</td><td class="number">'+cash(v.profit)+'</td><td class="number">'+cash(a.profit)+'</td><td class="number">'+cash(a.profit-v.profit)+'</td></tr>'}))+'</div><div class="card" style="margin-top:18px"><h2>Region summary</h2>'+table(['Portfolio','Plan revenue','Actual revenue','Plan profit','Actual profit'],[...new Set(ps.map(function(p){return p.portfolio}))].sort().map(function(k){var q=ps.filter(function(p){return p.portfolio===k}),z=totals(q,state.month),a=actualTotals(q,state.month);return '<tr><td>'+esc(k)+'</td><td class="number">'+cash(z.revenue)+'</td><td class="number">'+cash(a.revenue)+'</td><td class="number">'+cash(z.profit)+'</td><td class="number">'+cash(a.profit)+'</td></tr>'}))+'</div>'}
function settings(){return top('Settings','Exchange rate, demo data and access scope')+'<div class="grid"><div class="card"><h2>Currency conversion</h2><label class="field">EUR 1 = PLN <input id="fx" type="number" min=".01" step=".01" value="'+db.rate+'" '+(admin()?'':'disabled')+'></label>'+(admin()?btn('Save rate','rate'):'')+'<p class="note" style="margin-top:14px">Manual demonstration rate, not an official market feed.</p></div><div class="card"><h2>Demo data</h2><p class="note">Changes are saved locally in this browser. No server or authentication is connected.</p>'+btn('Download JSON','backup')+' <button class="btn" data-action="reset">Reset demo</button></div></div>'}
function modalHtml(){if(!state.modal)return '';var mode=state.modal,e=state.edit||{},form='';
function f(name,value,type,opts){var field='<label class="field">'+name+(opts?'<select name="'+name+'">'+opts.map(function(v){return '<option '+(v===value?'selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>':'<input type="'+(type||'text')+'" name="'+name+'" required value="'+esc(value==null?'':value)+'">')+'</label>';return field}
if(mode==='project'){form=f('name',e.name)+f('company',e.company||'Europtima','text',['Europtima','Portico'])+f('portfolio',e.portfolio||e.region||'Warsaw')+f('manager',e.manager||'Mirek Gołębski')+f('currency',e.currency||'PLN','text',['PLN','EUR'])+f('contract',e.contract||0,'number')+f('status',e.status||'Active','text',['Active','Pipeline','Completed'])}
if(mode==='employee'){form=f('name',e.name)+f('company',e.company||'Europtima','text',['Europtima','Portico'])+f('type',e.type||'Employment','text',['Employment','B2B'])+f('cost',e.cost||0,'number')}
if(mode==='cost'||mode==='subcontractor'||mode==='expense'){form='<label class="field">Project<select name="project">'+db.projects.map(function(p){return '<option value="'+p.id+'" '+(e.project===p.id?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></label>'+'<input type="hidden" name="type" value="'+(mode==='subcontractor'?'Subcontractor':mode==='expense'?'Expense':e.type)+'">'+f('label',e.label||'')+f('month',e.month||state.month,'month')+f('amount',e.amount||0,'number')}
if(mode==='allocation'){form='<label class="field">Project<select name="project">'+db.projects.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label><label class="field">Employee<select name="person">'+db.people.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label>'+f('month',state.month,'month')+f('pct',25,'number')}
return '<div class="overlay" id="overlay"><div class="modal"><h2>'+(e.id?'Edit ':'Add ')+mode+'</h2><form id="editForm"><div class="form-grid">'+form+'</div><div class="buttons"><button type="button" class="btn" data-action="cancel">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form></div></div>'}
function render(){var page={overview:overview,projects:projects,allocation:allocationPage,revenue:revenue,actuals:actuals,subcontractors:subcontractors,expenses:expenses,employees:employees,reports:reports,settings:settings}[state.tab];document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="logo">◈ PORTFOLIO ONE</div><div class="tag">CORPORATE PLANNING</div><div class="side-links">'+tabs.map(function(t){return '<button class="nav '+(state.tab===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div class="bottom">EUROPTIMA / PORTICO<br>Interactive demonstration<br>Not connected to production data</div></aside><div class="content"><div class="top"><div class="brand">Region & Financial Forecasting</div><div class="filters" style="margin:0">'+select('role',['Admin','Executive','Project director'],state.role)+'</div></div><main class="container"><div class="filters">'+select('company',['All','Europtima','Portico'],state.company)+select('portfolio',portfolioList(),state.portfolio)+select('month',months,state.month)+'</div>'+page()+'</main></div></div>'+modalHtml();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;render()}});['role','company','portfolio','month'].forEach(function(id){document.getElementById(id).onchange=function(e){state[id]=e.target.value;render()}});document.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){var a=b.dataset.action;if(['project','employee','cost','allocation','subcontractor','expense'].includes(a)){state.modal=a;state.edit=null;render()}else if(a==='cancel'){state.modal=null;render()}else if(a==='rate'){var val=Number(document.getElementById('fx').value);if(val>0){db.rate=val;save();render()}}else if(a==='reset'){if(confirm('Restore original demo data?')){db=JSON.parse(JSON.stringify(seed));save();render()}}else if(a==='backup'){download('region-one-demo.json',JSON.stringify(db,null,2),'application/json')}else if(a==='export'){var rows=[['Company','Portfolio','Project','Planned Revenue EUR','Actual Revenue EUR','Planned Costs EUR','Actual Costs EUR','Planned Gross Profit EUR','Actual Gross Profit EUR'],...visible().map(function(p){var c=calc(p,state.month),a=actualCalc(p,state.month);return[p.company,p.portfolio,p.name,c.revenue,a.revenue,c.cost,a.cost,c.profit,a.profit]})];download('region-pnl-'+state.month+'.csv',rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv')}}});
document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){var q=b.dataset.edit.split(':');state.modal=q[0];state.edit=q[0]==='project'?proj(q[1]):q[0]==='employee'?employee(q[1]):db.costs.find(function(x){return x.id===q[1]});render()}});
document.querySelectorAll('[data-alloc]').forEach(function(x){x.onchange=function(){var s=x.dataset.alloc.split('|'),pct=Math.max(0,Math.min(100,Number(x.value)||0)),a=db.alloc.find(function(t){return t.person===s[0]&&t.project===s[1]&&t.month===s[2]});if(a)a.pct=pct;else db.alloc.push({person:s[0],project:s[1],month:s[2],pct:pct});save();render()}});
document.querySelectorAll('[data-actual]').forEach(function(x){x.onchange=function(){var z=x.dataset.actual.split('|'),a=db.actuals.find(function(v){return v.project===z[0]&&v.month===z[1]});if(!a){a={project:z[0],month:z[1],revenue:0,staff:0,sub:0,expense:0};db.actuals.push(a)}a[z[2]]=Math.max(0,Number(x.value)||0);save();render()}});
document.querySelectorAll('[data-revenue]').forEach(function(x){x.onchange=function(){var s=x.dataset.revenue.split('|'),r=db.revenues.find(function(t){return t.project===s[0]&&t.month===s[1]});if(r)r.amount=Math.max(0,Number(x.value)||0);else db.revenues.push({project:s[0],month:s[1],kind:'Forecast',amount:Math.max(0,Number(x.value)||0)});save();render()}});
var form=document.getElementById('editForm');if(form)form.onsubmit=function(evt){evt.preventDefault();var o=Object.fromEntries(new FormData(form).entries()),m=state.modal,old=state.edit||{};if(m==='project'){o.contract=Number(o.contract);o.id=old.id||'p'+Date.now();delete o.region;if(old.id)db.projects=db.projects.map(function(p){return p.id===old.id?o:p});else db.projects.push(o)}else if(m==='employee'){o.cost=Number(o.cost);o.id=old.id||'e'+Date.now();if(old.id)db.people=db.people.map(function(p){return p.id===old.id?o:p});else db.people.push(o)}else if(m==='cost'||m==='subcontractor'||m==='expense'){o.amount=Number(o.amount);o.id=old.id||'c'+Date.now();if(old.id)db.costs=db.costs.map(function(p){return p.id===old.id?o:p});else db.costs.push(o)}else if(m==='allocation'){o.pct=Math.max(0,Math.min(100,Number(o.pct)));var a=db.alloc.find(function(t){return t.person===o.person&&t.project===o.project&&t.month===o.month});if(a)a.pct=o.pct;else db.alloc.push(o)}save();state.modal=null;state.edit=null;render()}}
function download(name,content,type){var blob=new Blob([content],{type:type||'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
render();
})();
</script></body></html>
