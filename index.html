<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio One | Europtima & Portico</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17233c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled,input:disabled{opacity:.55;cursor:not-allowed}.layout{display:flex;min-height:100vh}.side{width:245px;background:#14223b;color:#fff;padding:24px 16px;flex-shrink:0}.logo{font-size:20px;letter-spacing:1.6px;font-weight:800;margin:0 7px 6px}.tag{color:#9db1d1;font-size:11px;letter-spacing:1.7px;margin:0 8px 34px}.nav{width:100%;padding:13px;text-align:left;background:transparent;color:#bdcee7;border:0;border-radius:9px;margin:3px 0}.nav:hover,.nav.active{background:#293c60;color:white}.side .bottom{font-size:12px;color:#91a5c2;line-height:1.8;margin:50px 8px}.content{flex:1;min-width:0}.top{height:68px;background:white;border-bottom:1px solid #e1e6ef;padding:0 34px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700}.container{padding:28px 32px;max-width:1600px;margin:auto}h1{font-size:26px;margin:0 0 7px}h2{font-size:17px;margin:0 0 15px}p{color:#72809a;margin:0 0 23px}.filters,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.filters{margin-bottom:22px}select,input{background:white;border:1px solid #dce2eb;border-radius:8px;padding:9px 11px;color:#1c2943;max-width:100%}.btn{border:1px solid #d9e0ea;background:white;border-radius:8px;padding:10px 14px;color:#233750}.btn.primary{background:#3765d8;color:white;border-color:#3765d8}.btn.small{padding:6px 10px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:18px 0 24px}.card{background:white;border:1px solid #e2e7ef;border-radius:13px;padding:20px;box-shadow:0 4px 18px #18305706;overflow:auto}.metric-label{font-size:12px;color:#7a869d}.metric-value{font-weight:750;font-size:27px;margin:13px 0 7px}.meta{font-size:12px;color:#8590a2}.good{color:#16856a}.bad{color:#c55359}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:#8793a8;font-weight:700;background:#f8faff}th,td{padding:12px 10px;border-bottom:1px solid #e9edf4}tbody tr:hover{background:#f9fbff}.muted{color:#8a97a9}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8efff;color:#3260b0;font-size:11px;font-weight:700}.pill.green{background:#e8f8f1;color:#16856a}.number{text-align:right;font-variant-numeric:tabular-nums}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:12px;font-weight:650;color:#65758f}.field input,.field select{width:100%}.row-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.edit{width:66px;padding:7px;text-align:right}.month-head{text-align:center}.note{font-size:12px;color:#8290a2;line-height:1.6}.overlay{position:fixed;inset:0;background:#11213b99;display:flex;justify-content:center;align-items:center;z-index:20;padding:20px}.modal{background:white;border-radius:14px;padding:24px;width:min(510px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0003}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.wide{grid-column:1/-1}.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.notice{background:#f0f6ff;border-left:3px solid #557ada;color:#50627f;padding:11px 14px;border-radius:5px;font-size:12px;margin-bottom:20px}.bar{height:10px;background:#e5eafa;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#587de3}.click{color:#3765d8;cursor:pointer;font-weight:650}.alloc-warning{background:#fff1e9;color:#a35519}.stat-line{display:flex;justify-content:space-between;margin:11px 0;font-size:13px}.mobile-nav{display:none}.wide-table{min-width:780px}@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:740px){.layout{display:block}.side{width:100%;padding:12px}.side .bottom{display:none}.logo{font-size:15px}.tag{margin-bottom:8px}.side-links{display:flex;overflow:auto;gap:3px}.nav{width:auto;white-space:nowrap}.top{height:auto;padding:15px;gap:10px;flex-wrap:wrap}.container{padding:18px 13px}.metrics{gap:8px}.metric-value{font-size:21px}.card{padding:15px}.form-grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
(function(){
'use strict';
var KEY='europtima-portfolio-demo-v2';
var months=[];for(var yr=2026;yr<=2027;yr++)for(var mo=1;mo<=12;mo++)if(yr===2027||mo>=7)months.push(yr+'-'+String(mo).padStart(2,'0'));
var seed={rate:4.3,projects:[
{id:'p1',name:'Portico Marina',company:'Portico',region:'Warsaw',manager:'Mirek Gołębski',currency:'PLN',contract:780000,status:'Active'},
{id:'p2',name:'TR Main Contract',company:'Europtima',region:'Warsaw',manager:'Paweł Nowotniak',currency:'PLN',contract:1240000,status:'Active'},
{id:'p3',name:'Ochnik Garwolin',company:'Portico',region:'Gdańsk',manager:'Magda Płiszczyńska',currency:'PLN',contract:490000,status:'Active'},
{id:'p4',name:'CBRE WDC',company:'Europtima',region:'Kraków',manager:'Michał Miedziejewski',currency:'EUR',contract:280000,status:'Active'},
{id:'p5',name:'Międzylesie Hospital',company:'Portico',region:'Warsaw',manager:'Bartek Stanisławski',currency:'PLN',contract:635000,status:'Active'},
{id:'p6',name:'Bródno Hospital',company:'Europtima',region:'Warsaw',manager:'Karol Kalinowski',currency:'PLN',contract:720000,status:'Pipeline'}],
people:[{id:'e1',name:'Mirek Gołębski',type:'Employment',company:'Portico',cost:4800},{id:'e2',name:'Paweł Nowotniak',type:'B2B',company:'Europtima',cost:5750},{id:'e3',name:'Magda Płiszczyńska',type:'Employment',company:'Portico',cost:3900},{id:'e4',name:'Michał Miedziejewski',type:'B2B',company:'Europtima',cost:4300},{id:'e5',name:'Bartek Stanisławski',type:'Employment',company:'Portico',cost:3700},{id:'e6',name:'Karol Kalinowski',type:'B2B',company:'Europtima',cost:4100}],
alloc:[],revenues:[],costs:[]};
var pairs=[['e1','p1',60],['e1','p2',40],['e2','p2',75],['e2','p4',25],['e3','p3',75],['e3','p1',25],['e4','p4',70],['e4','p2',30],['e5','p5',80],['e5','p1',20],['e6','p2',70],['e6','p6',30]];
months.forEach(function(m,i){pairs.forEach(function(x){seed.alloc.push({person:x[0],project:x[1],month:m,pct:x[2]})});seed.projects.forEach(function(p,j){seed.revenues.push({project:p.id,month:m,kind:i<=3?'Actual':'Forecast',amount:Math.round([65000,103000,45000,23500,56000,60000][j]*(.8+((i*3+j*2)%7)/13))})})});
[['p1','Subcontractor',18000,'2026-09','Architectural partner'],['p2','Subcontractor',25000,'2026-10','Design services'],['p4','Subcontractor',4400,'2026-11','Engineering support'],['p3','Subcontractor',11000,'2027-01','Technical advisor'],['p1','Expense',1300,'2026-09','Travel'],['p2','Expense',2300,'2026-10','Travel']].forEach(function(x,i){seed.costs.push({id:'c'+i,project:x[0],type:x[1],amount:x[2],month:x[3],label:x[4]})});
var db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(seed))}catch(e){db=JSON.parse(JSON.stringify(seed))}
var state={tab:'overview',month:'2026-11',company:'All',role:'Admin',modal:null,edit:null};
var tabs=[['overview','Overview'],['projects','Projects'],['allocation','Staff allocation'],['revenue','Revenue forecast'],['costs','Costs & expenses'],['employees','Employees'],['reports','Financial reports'],['settings','Settings']];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(n){return Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:0})}
function eur(n,c){return Number(n||0)/(c==='PLN'?Number(db.rate)||4.3:1)}
function cash(n){return '€ '+num(n)}
function label(m){return new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}
function proj(id){return db.projects.find(function(p){return p.id===id})}
function employee(id){return db.people.find(function(p){return p.id===id})}
function admin(){return state.role==='Admin'}
function editable(){return state.role!=='Executive'}
function visible(){return db.projects.filter(function(p){return(state.company==='All'||p.company===state.company)&&(state.role!=='Project director'||p.manager==='Mirek Gołębski')})}
function allocation(e,p,m){var a=db.alloc.find(function(x){return x.person===e&&x.project===p&&x.month===m});return a?Number(a.pct):0}
function calc(p,m){var revenue=db.revenues.filter(function(x){return x.project===p.id&&x.month===m}).reduce(function(s,x){return s+eur(x.amount,p.currency)},0);
var staff=db.people.reduce(function(s,e){return s+Number(e.cost)*allocation(e.id,p.id,m)/100},0);
var sub=0,expense=0;db.costs.forEach(function(x){if(x.project===p.id&&x.month===m){if(x.type==='Subcontractor')sub+=eur(x.amount,p.currency);else expense+=eur(x.amount,p.currency)}});
return{revenue:revenue,staff:staff,sub:sub,expense:expense,cost:staff+sub+expense,profit:revenue-staff-sub-expense}};
function totals(list,m){var z={revenue:0,staff:0,sub:0,expense:0,cost:0,profit:0};list.forEach(function(p){var f=calc(p,m);Object.keys(z).forEach(function(k){z[k]+=f[k]})});return z}
function select(id,values,current){return '<select id="'+id+'">'+values.map(function(v){return '<option value="'+esc(v)+'" '+(v===current?'selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>'}
function projectOptions(){return db.projects.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join('')}
function top(title,desc,action){return '<div class="row-head"><div><h1>'+title+'</h1><p style="margin:0">'+desc+'</p></div>'+(action||'')+'</div>'}
function btn(name,action){return '<button class="btn primary" data-action="'+action+'">'+name+'</button>'}
function table(head,rows){return '<div class="table-wrap"><table><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function reportRow(p,m){var f=calc(p,m),margin=f.revenue?f.profit/f.revenue*100:0;return '<tr><td>'+esc(p.company)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.region)+'</td><td class="number">'+cash(f.revenue)+'</td><td class="number">'+cash(f.staff)+'</td><td class="number">'+cash(f.sub)+'</td><td class="number">'+cash(f.expense)+'</td><td class="number '+(f.profit>=0?'good':'bad')+'">'+cash(f.profit)+'</td><td class="number">'+margin.toFixed(1)+'%</td></tr>'}
function overview(){var ps=visible(),f=totals(ps,state.month),margin=f.revenue?f.profit/f.revenue*100:0;
var values=[['Revenue forecast',cash(f.revenue),'Selected month'],['Total costs',cash(f.cost),'Staff + contractors + expenses'],['Gross profit',cash(f.profit),'Revenue less total costs'],['Gross margin',margin.toFixed(1)+'%','Portfolio profitability']];
var cards='<div class="metrics">'+values.map(function(x){return '<div class="card"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+x[1]+'</div><div class="meta">'+x[2]+'</div></div>'}).join('')+'</div>';
var byCo=['Europtima','Portico'].map(function(c){var t=totals(ps.filter(function(p){return p.company===c}),state.month);return '<tr><td>'+c+'</td><td class="number">'+cash(t.revenue)+'</td><td class="number">'+cash(t.cost)+'</td><td class="number">'+cash(t.profit)+'</td></tr>'});
return top('Executive overview','Project profitability and resource commitments at a glance')+cards+'<div class="grid"><div class="card"><h2>Portfolio by company</h2>'+table(['Company','Revenue','Cost','Profit'],byCo)+'</div><div class="card"><h2>Project profit forecast</h2>'+ps.map(function(p){var v=calc(p,state.month);var margin=v.revenue?v.profit/v.revenue*100:0;return '<div class="stat-line"><span>'+esc(p.name)+'</span><strong>'+margin.toFixed(1)+'%</strong></div><div class="bar"><div style="width:'+Math.max(0,Math.min(100,margin))+'%"></div></div>'}).join('')+'</div></div>'}
function projects(){return top('Project portfolio','Company, region, project manager, value and status',editable()?btn('+ Add project','project'):'')+'<div class="card">'+table(['Project','Company','Region','Project director','Contract','Currency','Status',''],visible().map(function(p){return '<tr><td><strong>'+esc(p.name)+'</strong></td><td>'+p.company+'</td><td>'+esc(p.region)+'</td><td>'+esc(p.manager)+'</td><td class="number">'+num(p.contract)+'</td><td>'+p.currency+'</td><td><span class="pill">'+esc(p.status)+'</span></td><td>'+(editable()?'<button class="btn small" data-edit="project:'+p.id+'">Edit</button>':'')+'</td></tr>'}))+'</div>'}
function employees(){return top('Employee register','Confidential monthly employment and B2B cost rates',admin()?btn('+ Add employee','employee'):'')+'<div class="notice">Employee-specific cost rates are visible only in the Admin demo role. Production access control must be enforced on the server.</div><div class="card">'+table(['Employee','Company','Contract type','Monthly cost EUR',''],db.people.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.company+'</td><td>'+p.type+'</td><td class="number">'+(admin()?cash(p.cost):'Restricted')+'</td><td>'+(admin()?'<button class="btn small" data-edit="employee:'+p.id+'">Edit</button>':'')+'</td></tr>'}))+'</div>'}
function allocationPage(){var mm=months.slice(Math.max(0,months.indexOf(state.month)-1),months.indexOf(state.month)+5);
return top('Staff allocation','Plan staff time across projects; percentage of each month',editable()?btn('+ Add allocation','allocation'):'')+'<div class="notice">Edit the allocation percentages directly. Total assignments above 100% are highlighted. Staff costs recalculate automatically.</div><div class="card"><div class="table-wrap"><table class="wide-table"><thead><tr><th>Employee</th><th>Project</th>'+mm.map(function(m){return '<th class="month-head">'+label(m)+'</th>'}).join('')+'</tr></thead><tbody>'+db.alloc.filter(function(a){return mm.indexOf(a.month)>=0&&visible().some(function(p){return p.id===a.project})}).reduce(function(group,a){var k=a.person+'|'+a.project;if(!group[k])group[k]=a;return group},{})&&''+Object.values(db.alloc.filter(function(a){return mm.indexOf(a.month)>=0&&visible().some(function(p){return p.id===a.project})}).reduce(function(group,a){var k=a.person+'|'+a.project;if(!group[k])group[k]=a;return group},{})).map(function(a){return '<tr><td>'+esc(employee(a.person)?.name||'')+'</td><td>'+esc(proj(a.project)?.name||'')+'</td>'+mm.map(function(m){var pct=allocation(a.person,a.project,m);return '<td class="number"><input class="edit" type="number" min="0" max="100" step="5" data-alloc="'+a.person+'|'+a.project+'|'+m+'" value="'+pct+'" '+(editable()?'':'disabled')+'></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div><div class="card" style="margin-top:16px"><h2>Employee utilization check · '+label(state.month)+'</h2>'+table(['Employee','Allocated','Status'],db.people.map(function(e){var sum=db.alloc.filter(function(a){return a.person===e.id&&a.month===state.month}).reduce(function(s,a){return s+Number(a.pct)},0);return '<tr><td>'+esc(e.name)+'</td><td>'+sum+'%</td><td><span class="pill '+(sum>100?'alloc-warning':'green')+'">'+(sum>100?'Overallocated':'Within capacity')+'</span></td></tr>'}))+'</div>'}
function revenue(){var mm=months.slice(Math.max(0,months.indexOf(state.month)-1),months.indexOf(state.month)+5);
return top('Revenue forecast','Manage monthly actuals and forecasts in project currency')+'<div class="card"><div class="table-wrap"><table class="wide-table"><thead><tr><th>Project</th><th>Currency</th>'+mm.map(function(m){return '<th>'+label(m)+'</th>'}).join('')+'</tr></thead><tbody>'+visible().map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.currency+'</td>'+mm.map(function(m){var x=db.revenues.find(function(r){return r.project===p.id&&r.month===m});return '<td><input type="number" min="0" step="100" style="width:112px" data-revenue="'+p.id+'|'+m+'" value="'+(x?x.amount:0)+'" '+(editable()?'':'disabled')+'></td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div><p class="note">Figures entered in PLN are converted to EUR for the consolidated report using the admin-managed exchange rate.</p>'}
function costs(){return top('Subcontractors & expenses','Project-specific fixed subcontractor costs, travel and other expenses',editable()?btn('+ Add expense','cost'):'')+'<div class="card">'+table(['Project','Category','Description','Month','Amount','Currency',''],db.costs.filter(function(x){return visible().some(function(p){return p.id===x.project})}).map(function(c){var p=proj(c.project);return '<tr><td>'+esc(p?.name)+'</td><td><span class="pill">'+c.type+'</span></td><td>'+esc(c.label)+'</td><td>'+label(c.month)+'</td><td class="number">'+num(c.amount)+'</td><td>'+p?.currency+'</td><td>'+(editable()?'<button class="btn small" data-edit="cost:'+c.id+'">Edit</button>':'')+'</td></tr>'}))+'</div>'}
function reports(){var ps=visible(),f=totals(ps,state.month);return top('P&L financial report','Consolidated monthly project performance in EUR',btn('Export CSV','export'))+'<div class="metrics">'+[['Revenue',f.revenue],['Staff cost',f.staff],['Subcontractors + expenses',f.sub+f.expense],['Gross profit',f.profit]].map(function(x){return '<div class="card"><div class="metric-label">'+x[0]+'</div><div class="metric-value">'+cash(x[1])+'</div></div>'}).join('')+'</div><div class="card">'+table(['Company','Project','Region','Revenue EUR','Staff EUR','Subcontractors EUR','Expenses EUR','Gross profit EUR','Margin'],ps.map(function(p){return reportRow(p,state.month)}))+'</div>'}
function settings(){return top('Settings','Exchange rate, demo data and access scope')+'<div class="grid"><div class="card"><h2>Currency conversion</h2><label class="field">EUR 1 = PLN <input id="fx" type="number" min=".01" step=".01" value="'+db.rate+'" '+(admin()?'':'disabled')+'></label>'+(admin()?btn('Save rate','rate'):'')+'<p class="note" style="margin-top:14px">Manual demonstration rate, not an official market feed.</p></div><div class="card"><h2>Demo data</h2><p class="note">Changes are saved locally in this browser. No server or authentication is connected.</p>'+btn('Download JSON','backup')+' <button class="btn" data-action="reset">Reset demo</button></div></div>'}
function modalHtml(){if(!state.modal)return '';var mode=state.modal,e=state.edit||{},form='';
function f(name,value,type,opts){var field='<label class="field">'+name+(opts?'<select name="'+name+'">'+opts.map(function(v){return '<option '+(v===value?'selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select>':'<input type="'+(type||'text')+'" name="'+name+'" required value="'+esc(value==null?'':value)+'">')+'</label>';return field}
if(mode==='project'){form=f('name',e.name)+f('company',e.company||'Europtima','text',['Europtima','Portico'])+f('region',e.region||'Warsaw')+f('manager',e.manager||'Mirek Gołębski')+f('currency',e.currency||'PLN','text',['PLN','EUR'])+f('contract',e.contract||0,'number')+f('status',e.status||'Active','text',['Active','Pipeline','Completed'])}
if(mode==='employee'){form=f('name',e.name)+f('company',e.company||'Europtima','text',['Europtima','Portico'])+f('type',e.type||'Employment','text',['Employment','B2B'])+f('cost',e.cost||0,'number')}
if(mode==='cost'){form='<label class="field">Project<select name="project">'+db.projects.map(function(p){return '<option value="'+p.id+'" '+(e.project===p.id?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></label>'+f('type',e.type||'Expense','text',['Expense','Subcontractor'])+f('label',e.label||'')+f('month',e.month||state.month,'month')+f('amount',e.amount||0,'number')}
if(mode==='allocation'){form='<label class="field">Project<select name="project">'+db.projects.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label><label class="field">Employee<select name="person">'+db.people.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></label>'+f('month',state.month,'month')+f('pct',25,'number')}
return '<div class="overlay" id="overlay"><div class="modal"><h2>'+(e.id?'Edit ':'Add ')+mode+'</h2><form id="editForm"><div class="form-grid">'+form+'</div><div class="buttons"><button type="button" class="btn" data-action="cancel">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form></div></div>'}
function render(){var page={overview:overview,projects:projects,allocation:allocationPage,revenue:revenue,costs:costs,employees:employees,reports:reports,settings:settings}[state.tab];document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="logo">◈ PORTFOLIO ONE</div><div class="tag">CORPORATE PLANNING</div><div class="side-links">'+tabs.map(function(t){return '<button class="nav '+(state.tab===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div><div class="bottom">EUROPTIMA / PORTICO<br>Interactive demonstration<br>Not connected to production data</div></aside><div class="content"><div class="top"><div class="brand">Portfolio & Financial Forecasting</div><div class="filters" style="margin:0">'+select('role',['Admin','Executive','Project director'],state.role)+'</div></div><main class="container"><div class="filters">'+select('company',['All','Europtima','Portico'],state.company)+select('month',months,state.month)+'</div>'+page()+'</main></div></div>'+modalHtml();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;render()}});['role','company','month'].forEach(function(id){document.getElementById(id).onchange=function(e){state[id]=e.target.value;render()}});document.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){var a=b.dataset.action;if(['project','employee','cost','allocation'].includes(a)){state.modal=a;state.edit=null;render()}else if(a==='cancel'){state.modal=null;render()}else if(a==='rate'){var val=Number(document.getElementById('fx').value);if(val>0){db.rate=val;save();render()}}else if(a==='reset'){if(confirm('Restore original demo data?')){db=JSON.parse(JSON.stringify(seed));save();render()}}else if(a==='backup'){download('portfolio-one-demo.json',JSON.stringify(db,null,2),'application/json')}else if(a==='export'){var rows=[['Company','Project','Region','Revenue EUR','Staff EUR','Subcontractors EUR','Expenses EUR','Gross Profit EUR'],...visible().map(function(p){var c=calc(p,state.month);return[p.company,p.name,p.region,c.revenue,c.staff,c.sub,c.expense,c.profit]})];download('portfolio-pnl-'+state.month+'.csv',rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv')}}});
document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){var q=b.dataset.edit.split(':');state.modal=q[0];state.edit=q[0]==='project'?proj(q[1]):q[0]==='employee'?employee(q[1]):db.costs.find(function(x){return x.id===q[1]});render()}});
document.querySelectorAll('[data-alloc]').forEach(function(x){x.onchange=function(){var s=x.dataset.alloc.split('|'),pct=Math.max(0,Math.min(100,Number(x.value)||0)),a=db.alloc.find(function(t){return t.person===s[0]&&t.project===s[1]&&t.month===s[2]});if(a)a.pct=pct;else db.alloc.push({person:s[0],project:s[1],month:s[2],pct:pct});save();render()}});
document.querySelectorAll('[data-revenue]').forEach(function(x){x.onchange=function(){var s=x.dataset.revenue.split('|'),r=db.revenues.find(function(t){return t.project===s[0]&&t.month===s[1]});if(r)r.amount=Math.max(0,Number(x.value)||0);else db.revenues.push({project:s[0],month:s[1],kind:'Forecast',amount:Math.max(0,Number(x.value)||0)});save();render()}});
var form=document.getElementById('editForm');if(form)form.onsubmit=function(evt){evt.preventDefault();var o=Object.fromEntries(new FormData(form).entries()),m=state.modal,old=state.edit||{};if(m==='project'){o.contract=Number(o.contract);o.id=old.id||'p'+Date.now();if(old.id)db.projects=db.projects.map(function(p){return p.id===old.id?o:p});else db.projects.push(o)}else if(m==='employee'){o.cost=Number(o.cost);o.id=old.id||'e'+Date.now();if(old.id)db.people=db.people.map(function(p){return p.id===old.id?o:p});else db.people.push(o)}else if(m==='cost'){o.amount=Number(o.amount);o.id=old.id||'c'+Date.now();if(old.id)db.costs=db.costs.map(function(p){return p.id===old.id?o:p});else db.costs.push(o)}else if(m==='allocation'){o.pct=Math.max(0,Math.min(100,Number(o.pct)));var a=db.alloc.find(function(t){return t.person===o.person&&t.project===o.project&&t.month===o.month});if(a)a.pct=o.pct;else db.alloc.push(o)}save();state.modal=null;state.edit=null;render()}}
function download(name,content,type){var blob=new Blob([content],{type:type||'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
